<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance — Rohtak Public School SMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">R</div>
      <div><b>RPS Rohtak</b><span>Student MS</span></div>
    </div>
    <a class="nav-link" href="dashboard.html"><span class="dot"></span>Dashboard</a>
    <a class="nav-link" href="students.html"><span class="dot"></span>Students</a>
    <a class="nav-link active" href="attendance.html"><span class="dot"></span>Attendance</a>
    <a class="nav-link" href="marks.html"><span class="dot"></span>Marks &amp; Results</a>
    <div class="spacer"></div>
    <div class="signout" id="userEmail">…</div>
    <a class="nav-link" href="#" id="signOutBtn" style="margin-top:8px;">↩ Sign out</a>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <div class="eyebrow">Register</div>
        <h2>Attendance</h2>
        <p>Mark today's roll call, or revisit a past date.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Take attendance</h3>
        <div class="toolbar">
          <select id="classSelect"></select>
          <input type="date" id="dateInput" />
          <button class="btn btn-accent btn-sm" id="saveAttendanceBtn">Save attendance</button>
        </div>
      </div>
      <div class="card-body" id="attendanceWrap">
        <div class="loader">Pick a class to begin.</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
